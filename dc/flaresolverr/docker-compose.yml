services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: always
    ports:
      - 8191:8191
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    volumes:
      - ${VOLUME_ROOT}/flaresolverr/config:/config
    networks:
      - homelab-network
