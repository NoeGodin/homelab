services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:v3.0.3
    volumes:
      - ${STORAGE_ROOT}/data/photos:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
      - ${VOLUME_ROOT}/immich/server-data:/data
    env_file:
      - .env
    ports:
      - 2283:2283
    depends_on:
      - redis
      - database
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    networks:
      - homelab-network

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:v3.0.3
    volumes:
      - ${VOLUME_ROOT}/immich/model-cache:/cache
    env_file:
      - .env
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    networks:
      - homelab-network

  redis:
    container_name: immich_redis
    image: redis:6.2-alpine
    volumes:
      - ${VOLUME_ROOT}/immich/redis:/data
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    networks:
      - homelab-network

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_DB=${DB_DATABASE_NAME}
      - POSTGRES_INITDB_ARGS=--data-checksums
    volumes:
      - ${VOLUME_ROOT}/immich/postgres:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    networks:
      - homelab-network
