services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: always
    ports:
      - 6767:6767
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${VOLUME_ROOT}/bazarr/config:/config
      # Same 1:1 mount as sonarr/radarr, so paths Bazarr imports from them
      # resolve as-is and no path mapping is needed. See CLAUDE.md.
      - ${DATA_ROOT}:/data
    networks:
      - homelab-network
