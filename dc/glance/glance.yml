theme:
  background-color: 0 0 16
  primary-color: 43 59 81
  positive-color: 61 66 44
  negative-color: 6 96 59
pages:
  - name: Startpage
    width: slim
    hide-desktop-navigation: false
    center-vertically: true
    columns:
      - size: full
        widgets:
          - type: search
            autofocus: true
            search-engine: google
            new-tab: true
            bangs:
              - title: YouTube
                shortcut: "!yt"
                url: https://www.youtube.com/results?search_query={QUERY}
              - title: Github
                shortcut: "!gh"
                url: https://github.com/search?q={QUERY}&type=repositories

          - type: monitor
            cache: 1m
            title: Services
            sites:
              - title: Lecteur Vidéo
                url: https://jellyfin.godinlab.com
                check-url: http://jellyfin:8096
                icon: di:jellyfin
              - title: Catalogue
                url: https://jellyseerr.godinlab.com
                check-url: http://jellyseerr:5055
                icon: di:jellyseerr
              - title: Photos
                url: https://photos.godinlab.com
                check-url: http://immich-server:2283
                icon: di:immich

